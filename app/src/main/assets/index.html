<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>GAD OPERASIONAL</title><style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eef5ff;font-family:Arial,Helvetica,sans-serif}.wrap{max-width:760px;margin:auto;padding:18px 16px 40px}.brand{font-size:26px;font-weight:800}.sub{color:#8fa4bd;font-size:13px;margin-top:4px}.card{background:#122236;border:1px solid #20344b;border-radius:20px;padding:18px;margin-top:16px;box-shadow:0 8px 25px #0002}label{display:block;color:#9db0c5;font-size:13px;margin:12px 0 6px}input,select{width:100%;padding:14px;border-radius:12px;border:1px solid #30465f;background:#0b1727;color:white;font-size:15px;outline:none}input:focus,select:focus{border-color:#4c8dff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.title{font-size:18px;font-weight:800;margin-bottom:8px}.expense{display:grid;grid-template-columns:1fr 150px;gap:10px;align-items:center}.row{padding:9px 0;border-bottom:1px solid #21364b}.row:last-child{border-bottom:0}.sum{display:flex;justify-content:space-between;font-size:18px;font-weight:800;padding-top:15px}.orange{color:#ff8a36}.green{color:#27d39a}.balance{margin-top:14px;background:#f5fbff;color:#0a1625;border-radius:20px;padding:18px}.balance small{display:block;color:#159d72;font-weight:700}.balance b{display:block;font-size:29px;margin-top:4px}.btns{display:grid;gap:10px;margin-top:16px}.btn{border:0;border-radius:14px;padding:15px;font-size:15px;font-weight:800;color:white;background:#3f82ff}.btn.greenBtn{background:#18a96f}.btn.dark{background:transparent;border:1px solid #4a617b}.btn.red{background:#d94d4d}.history{display:none}.item{background:#0c1929;border:1px solid #20344b;border-radius:14px;padding:13px;margin:9px 0}.item b{font-size:15px}.muted{color:#8fa4bd;font-size:12px}.empty{text-align:center;color:#71869d;padding:15px}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;justify-content:center}.sheet{width:min(760px,100%);background:#0d1a2a;border-radius:24px 24px 0 0;padding:20px;max-height:85vh;overflow:auto}.sheet h2{margin:0 0 12px}.x{float:right;border:0;background:none;color:white;font-size:25px}.print{background:white;color:#111;padding:28px;font-family:Arial}.print h1{margin-top:0}.print table{width:100%;border-collapse:collapse}.print td{padding:8px;border-bottom:1px solid #ddd}.print .total{font-weight:800}.noPrint{display:none!important}@media(max-width:560px){.grid{grid-template-columns:1fr}.expense{grid-template-columns:1fr 125px}}
</style></head><body><div class="wrap"><div class="brand">GAD OPERASIONAL</div><div class="sub">Laporan operasional kendaraan & event</div>
<div class="card"><div class="title">Data Event</div><div class="grid"><div><label>Tanggal</label><input id="date" type="date"></div><div><label>Jenis Event</label><input id="event" placeholder="Contoh: Pameran"></div><div><label>Lokasi Event</label><input id="location" placeholder="Contoh: JCC"></div><div><label>Jenis Kendaraan</label><input id="vehicle" placeholder="Contoh: Isuzu NLR"></div><div><label>No. Polisi</label><input id="plate" placeholder="Contoh: AB 777 GAD"></div><div><label>Nama Driver</label><input id="driver" placeholder="Nama supir"></div></div></div>
<div class="card"><div class="title">Uang Operasional</div><label>Uang Ops Kantor (Diterima)</label><input id="budget" inputmode="numeric" placeholder="Rp 0" oninput="calc()"></div>
<div class="card"><div class="title">Daftar Pengeluaran</div><div class="row expense"><span>⛽ Solar / Bensin</span><input id="fuel" inputmode="numeric" placeholder="Rp 0" oninput="calc()"></div><div class="row expense"><span>🚗 Tol</span><input id="toll" inputmode="numeric" placeholder="Rp 0" oninput="calc()"></div><div class="row expense"><span>🅿️ Parkir</span><input id="parking" inputmode="numeric" placeholder="Rp 0" oninput="calc()"></div><div class="row expense"><span>🛡️ Uang Security / Ormas</span><input id="security" inputmode="numeric" placeholder="Rp 0" oninput="calc()"></div><div class="row expense"><span>🍽️ Uang Makan Crew</span><input id="food" inputmode="numeric" placeholder="Rp 0" oninput="calc()"></div><div class="sum"><span>Total Pengeluaran</span><span class="orange" id="total">Rp 0</span></div><div class="sum"><span>Sisa / Kembali Kantor</span><span class="green" id="balance">Rp 0</span></div></div>
<div class="btns"><button class="btn" onclick="saveReport()">💾 Simpan Laporan</button><button class="btn" onclick="printReport()">🖨️ Lihat / Cetak Laporan</button><button class="btn greenBtn" onclick="shareWA()">📤 Bagikan ke WhatsApp</button><button class="btn dark" onclick="copyReport()">📋 Salin Format Laporan</button><button class="btn dark" onclick="showHistory()">📚 Riwayat Laporan</button></div></div>
<div class="modal" id="modal"><div class="sheet"><button class="x" onclick="closeHistory()">×</button><h2>Riwayat Laporan</h2><div id="history"></div></div></div>
<script>
const ids=['date','event','location','vehicle','plate','driver','budget','fuel','toll','parking','security','food'];
const moneyIds=['budget','fuel','toll','parking','security','food'];
function rupiah(n){return 'Rp '+Number(n||0).toLocaleString('id-ID')}
function num(id){return Number((document.getElementById(id).value||'').replace(/[^0-9]/g,''))||0}
function calc(){let t=['fuel','toll','parking','security','food'].reduce((s,id)=>s+num(id),0);document.getElementById('total').textContent=rupiah(t);document.getElementById('balance').textContent=(num('budget')-t>=0?'+':'-')+rupiah(Math.abs(num('budget')-t)).replace('Rp ','Rp ')}
function val(id){return document.getElementById(id).value}
function data(){return {date:val('date'),event:val('event'),location:val('location'),vehicle:val('vehicle'),plate:val('plate'),driver:val('driver'),budget:num('budget'),fuel:num('fuel'),toll:num('toll'),parking:num('parking'),security:num('security'),food:num('food'),created:new Date().toISOString()}}
function setData(d){ids.forEach(id=>{let el=document.getElementById(id);if(el)el.value=d[id]??''});moneyIds.forEach(id=>{let el=document.getElementById(id);if(el.value)el.value=Number(el.value).toLocaleString('id-ID')});calc()}
function saveReport(){let d=data();if(!d.location&&!d.event){alert('Isi minimal lokasi atau jenis event.');return}let h=JSON.parse(localStorage.gadReports||'[]');h.unshift(d);localStorage.gadReports=JSON.stringify(h.slice(0,100));alert('Laporan berhasil disimpan.');showHistory()}
function textReport(){let d=data(),t=d.fuel+d.toll+d.parking+d.security+d.food,b=d.budget-t;return `LAPORAN OPERASIONAL GAD PRODUCTION\nTanggal: ${d.date}\nEvent: ${d.event||'-'}\nLokasi: ${d.location||'-'}\nKendaraan: ${d.vehicle||'-'}\nNo. Polisi: ${d.plate||'-'}\nDriver: ${d.driver||'-'}\n\nSolar/Bensin: ${rupiah(d.fuel)}\nTol: ${rupiah(d.toll)}\nParkir: ${rupiah(d.parking)}\nSecurity/Ormas: ${rupiah(d.security)}\nMakan Crew: ${rupiah(d.food)}\nTOTAL PENGELUARAN: ${rupiah(t)}\nUANG OPS DITERIMA: ${rupiah(d.budget)}\nSISA/KEMBALI KANTOR: ${rupiah(b)}`}
function printReport(){let d=data(),t=d.fuel+d.toll+d.parking+d.security+d.food,b=d.budget-t;let html=`<meta charset="utf-8"><style>body{font-family:Arial,sans-serif;color:#111;padding:24px}h1{margin-top:0}table{width:100%;border-collapse:collapse}td{padding:8px;border-bottom:1px solid #ddd}.total{font-weight:800}</style><div class="print"><h1>Rincian Laporan Operasional</h1><p>${d.date}</p><h2>${d.event||'Event'}</h2><p>Lokasi: ${d.location||'-'}<br>Kendaraan: ${d.vehicle||'-'}<br>No. Polisi: ${d.plate||'-'}<br>Driver: ${d.driver||'-'}</p><table><tr><td>Solar / Bensin</td><td>${rupiah(d.fuel)}</td></tr><tr><td>Tol</td><td>${rupiah(d.toll)}</td></tr><tr><td>Parkir</td><td>${rupiah(d.parking)}</td></tr><tr><td>Security / Ormas</td><td>${rupiah(d.security)}</td></tr><tr><td>Makan Crew</td><td>${rupiah(d.food)}</td></tr><tr class="total"><td>Total Pengeluaran</td><td>${rupiah(t)}</td></tr><tr class="total"><td>Uang Ops Kantor (Diterima)</td><td>${rupiah(d.budget)}</td></tr><tr class="total"><td>Sisa / Kembali Kantor</td><td>${rupiah(b)}</td></tr></table><p>Dicetak dari GAD OPERASIONAL</p></div>`;if(window.Android){Android.print(html)}else{let w=window.open('','_blank');w.document.write(html);w.document.close();w.print()}}
function shareWA(){let t=textReport();if(window.Android)Android.whatsapp(t);else if(navigator.share)navigator.share({text:t});else location.href='https://wa.me/?text='+encodeURIComponent(t)}
function copyReport(){let t=textReport();if(window.Android&&Android.copy){Android.copy(t);alert('Format laporan disalin.');return}navigator.clipboard?.writeText(t).then(()=>alert('Format laporan disalin.')).catch(()=>alert(t))}
function showHistory(){let h=JSON.parse(localStorage.gadReports||'[]'),box=document.getElementById('history');box.innerHTML=h.length?h.map((d,i)=>{let t=d.fuel+d.toll+d.parking+d.security+d.food;return `<div class="item"><b>${d.event||'Event'} — ${d.location||'-'}</b><div class="muted">${d.date} • ${d.vehicle||'-'} • ${d.plate||'-'}</div><div style="margin-top:6px">Total ${rupiah(t)} • Sisa ${rupiah(d.budget-t)}</div><div style="display:flex;gap:7px;margin-top:9px"><button class="btn" style="padding:9px" onclick="loadHistory(${i})">Buka</button><button class="btn red" style="padding:9px" onclick="deleteHistory(${i})">Hapus</button></div></div>`}).join(''):'<div class="empty">Belum ada laporan tersimpan.</div>';document.getElementById('modal').style.display='flex'}
function closeHistory(){document.getElementById('modal').style.display='none'}
function loadHistory(i){let h=JSON.parse(localStorage.gadReports||'[]');setData(h[i]);closeHistory()}
function deleteHistory(i){let h=JSON.parse(localStorage.gadReports||'[]');h.splice(i,1);localStorage.gadReports=JSON.stringify(h);showHistory()}
document.getElementById('date').value=new Date().toISOString().slice(0,10);calc();
</script></body></html>
